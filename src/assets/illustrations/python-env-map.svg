<svg viewBox="0 0 620 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Python environment map for the QB2: Ubuntu's system Python, the hardware-tooling venv on the host, and the containers that hold TTNN and vLLM">
  <title>Python Environment Map — the host venv vs the containers</title>
  <defs>
    <pattern id="grid2" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10,0 L0,0 0,10" fill="none" stroke="rgba(79,209,197,0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="620" height="268" rx="6" fill="#0a1e28"/>
  <rect width="620" height="268" rx="6" fill="url(#grid2)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="620" height="24" rx="6" fill="#0F2A35"/>
  <rect x="0" y="18" width="620" height="6" fill="#0F2A35"/>
  <text x="14" y="16" fill="#607D8B" font-size="8" font-family="monospace" letter-spacing="1.5">PYTHON ENVIRONMENTS — TT-QUIETBOX 2</text>

  <!-- ══════════ COLUMN 1: SYSTEM ══════════ -->
  <text x="18" y="42" fill="#607D8B" font-size="8" font-family="monospace" letter-spacing="1">UBUNTU SYSTEM</text>

  <rect x="12" y="48" width="132" height="28" rx="3" fill="rgba(45,49,66,0.4)" stroke="rgba(96,125,139,0.3)" stroke-width="1"/>
  <text x="78" y="61" text-anchor="middle" fill="#607D8B" font-size="8" font-family="monospace">/usr/bin/python3</text>
  <text x="78" y="71" text-anchor="middle" fill="#445566" font-size="7" font-family="monospace">Ubuntu system Python</text>

  <!-- warning: externally managed -->
  <rect x="12" y="82" width="132" height="46" rx="3" fill="rgba(244,196,113,0.04)" stroke="rgba(244,196,113,0.2)" stroke-width="1"/>
  <text x="78" y="96" text-anchor="middle" fill="#F4C471" font-size="7.5" font-family="monospace">⚠  don't pip install</text>
  <text x="78" y="107" text-anchor="middle" fill="#607D8B" font-size="7" font-family="monospace">here — Ubuntu 24.04</text>
  <text x="78" y="118" text-anchor="middle" fill="#607D8B" font-size="7" font-family="monospace">externally-managed</text>

  <!-- your own venvs -->
  <rect x="12" y="134" width="132" height="52" rx="3" fill="rgba(96,125,139,0.05)" stroke="rgba(96,125,139,0.25)" stroke-width="1"/>
  <text x="78" y="148" text-anchor="middle" fill="#9FB4BC" font-size="7.5" font-family="monospace">your own packages</text>
  <text x="78" y="160" text-anchor="middle" fill="#607D8B" font-size="7" font-family="monospace">uv tool install ...</text>
  <text x="78" y="170" text-anchor="middle" fill="#607D8B" font-size="7" font-family="monospace">python3 -m venv ...</text>
  <text x="78" y="180" text-anchor="middle" fill="#445566" font-size="6.5" font-family="monospace">e.g. hf, Forge</text>

  <!-- which python3 -->
  <rect x="12" y="192" width="132" height="50" rx="3" fill="rgba(79,209,197,0.04)" stroke="rgba(79,209,197,0.2)" stroke-width="1"/>
  <text x="78" y="205" text-anchor="middle" fill="#81E6D9" font-size="7.5" font-family="monospace">check what's active:</text>
  <text x="78" y="219" text-anchor="middle" fill="#4FD1C5" font-size="8" font-family="monospace">which python3</text>
  <text x="78" y="232" text-anchor="middle" fill="#607D8B" font-size="7" font-family="monospace">echo $VIRTUAL_ENV</text>

  <!-- divider -->
  <line x1="154" y1="36" x2="154" y2="248" stroke="rgba(79,209,197,0.08)" stroke-width="1"/>

  <!-- ══════════ COLUMN 2: ON THE HOST ══════════ -->
  <text x="166" y="42" fill="#607D8B" font-size="8" font-family="monospace" letter-spacing="1">ON THE HOST</text>

  <rect x="162" y="48" width="176" height="72" rx="4" fill="rgba(244,196,113,0.04)" stroke="#F4C471" stroke-width="1.5"/>
  <text x="250" y="63" text-anchor="middle" fill="#F4C471" font-size="8.5" font-family="monospace" letter-spacing="0.5">hardware tooling</text>
  <text x="250" y="76" text-anchor="middle" fill="#E6B55E" font-size="7" font-family="monospace">~/.tenstorrent-venv/</text>
  <text x="174" y="90" fill="#607D8B" font-size="7" font-family="monospace">tt-smi   tt-flash   pyluwen</text>
  <text x="174" y="101" fill="#445566" font-size="6.5" font-family="monospace">(tt-topology if you opted in)</text>
  <text x="174" y="113" fill="#607D8B" font-size="6.5" font-family="monospace">activated for you at login</text>

  <!-- the key warning -->
  <rect x="162" y="126" width="176" height="48" rx="3" fill="rgba(255,107,107,0.04)" stroke="rgba(255,107,107,0.3)" stroke-width="1"/>
  <text x="250" y="140" text-anchor="middle" fill="#FF6B6B" font-size="7.5" font-family="monospace">⚠  nothing else in here</text>
  <text x="174" y="152" fill="#607D8B" font-size="6.5" font-family="monospace">no vllm · no ttnn · no huggingface_hub</text>
  <text x="174" y="164" fill="#607D8B" font-size="6.5" font-family="monospace">a bad resolve here = no tt-smi</text>

  <!-- gone: the old TTNN venv -->
  <rect x="162" y="180" width="176" height="44" rx="3" fill="rgba(45,49,66,0.25)" stroke="rgba(96,125,139,0.2)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="250" y="194" text-anchor="middle" fill="#607D8B" font-size="7" font-family="monospace">~/tt-metal/python_env/</text>
  <line x1="176" y1="191" x2="324" y2="191" stroke="rgba(255,107,107,0.45)" stroke-width="1"/>
  <text x="250" y="206" text-anchor="middle" fill="#445566" font-size="6.5" font-family="monospace">does not exist — legacy path</text>
  <text x="250" y="217" text-anchor="middle" fill="#445566" font-size="6.5" font-family="monospace">TTNN moved into the container →</text>

  <!-- divider 2 -->
  <line x1="348" y1="36" x2="348" y2="248" stroke="rgba(79,209,197,0.08)" stroke-width="1"/>

  <!-- ══════════ COLUMN 3: CONTAINERS ══════════ -->
  <text x="360" y="42" fill="#607D8B" font-size="8" font-family="monospace" letter-spacing="1">IN CONTAINERS  (~/.local/bin wrappers)</text>

  <!-- TTNN / Metalium -->
  <rect x="356" y="48" width="252" height="72" rx="4" fill="rgba(79,209,197,0.05)" stroke="#4FD1C5" stroke-width="1.5"/>
  <text x="482" y="63" text-anchor="middle" fill="#4FD1C5" font-size="8.5" font-family="monospace" letter-spacing="0.5">TTNN / Direct API</text>
  <text x="482" y="77" text-anchor="middle" fill="#81E6D9" font-size="8" font-family="monospace">tt-metalium</text>
  <text x="368" y="91" fill="#607D8B" font-size="7" font-family="monospace">→ /opt/venv/bin/python3   (import ttnn)</text>
  <text x="368" y="102" fill="#445566" font-size="6.5" font-family="monospace">home mounted at /home/user · --rm, so</text>
  <text x="368" y="112" fill="#445566" font-size="6.5" font-family="monospace">only your home directory survives exit</text>

  <!-- serving -->
  <rect x="356" y="126" width="252" height="60" rx="4" fill="rgba(236,150,184,0.04)" stroke="rgba(236,150,184,0.45)" stroke-width="1.5"/>
  <text x="482" y="141" text-anchor="middle" fill="#EC96B8" font-size="8.5" font-family="monospace" letter-spacing="0.5">serving  (vLLM lives in here)</text>
  <text x="482" y="155" text-anchor="middle" fill="#EC96B8" font-size="7" font-family="monospace">~/.local/lib/tt-inference-server/run.py</text>
  <text x="368" y="169" fill="#607D8B" font-size="6.5" font-family="monospace">--workflow server --tt-device p300x2 --docker-server</text>
  <text x="368" y="180" fill="#445566" font-size="6.5" font-family="monospace">OpenAI-compatible API on :8000 · or use tt-studio</text>

  <!-- Forge -->
  <rect x="356" y="192" width="122" height="50" rx="4" fill="rgba(39,174,96,0.04)" stroke="rgba(39,174,96,0.3)" stroke-width="1.5"/>
  <text x="417" y="206" text-anchor="middle" fill="#27AE60" font-size="8" font-family="monospace">TT-Forge / TT-XLA</text>
  <text x="417" y="219" text-anchor="middle" fill="#607D8B" font-size="6.5" font-family="monospace">~/.local/bin/tt-forge</text>
  <text x="417" y="230" text-anchor="middle" fill="#445566" font-size="6.5" font-family="monospace">opt-in — or a venv</text>
  <text x="417" y="239" text-anchor="middle" fill="#445566" font-size="6.5" font-family="monospace">of its own</text>

  <!-- Model storage -->
  <rect x="486" y="192" width="122" height="50" rx="4" fill="rgba(79,209,197,0.04)" stroke="rgba(79,209,197,0.25)" stroke-width="1.5"/>
  <text x="547" y="206" text-anchor="middle" fill="#81E6D9" font-size="8" font-family="monospace">model storage</text>
  <text x="547" y="219" text-anchor="middle" fill="#81E6D9" font-size="7" font-family="monospace">~/models/</text>
  <text x="547" y="230" text-anchor="middle" fill="#607D8B" font-size="6.5" font-family="monospace">Qwen3-0.6B/  ~1.5 GB</text>
  <text x="547" y="239" text-anchor="middle" fill="#445566" font-size="6.5" font-family="monospace">~/tt-scratchpad/</text>

  <!-- Bottom note -->
  <text x="14" y="259" fill="rgba(96,125,139,0.6)" font-size="7" font-family="monospace">One venv on the host, for the hardware tools only. TTNN and vLLM both live in containers — reached via tt-metalium and run.py.</text>

  <rect x="1" y="1" width="618" height="266" rx="5" fill="none" stroke="rgba(79,209,197,0.1)" stroke-width="1.5"/>
</svg>
